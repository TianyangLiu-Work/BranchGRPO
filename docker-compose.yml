services:
  branchgrpo:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-verlai/verl:app-verl0.6-transformers4.56.1-sglang0.5.2-mcore0.13.0-te2.2}
    image: ${IMAGE:-branchgrpo:sglang-verl}
    working_dir: /workspace
    ipc: host
    network_mode: host
    shm_size: "16gb"
    volumes:
      - .:/workspace
      - ${HF_CACHE:-.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      PYTHONPATH: /workspace/src:/workspace
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
