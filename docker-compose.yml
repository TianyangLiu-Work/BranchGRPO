services:
  branchgrpo:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-verlai/verl:sgl059.latest}
    image: ${IMAGE:-branchgrpo:sglang-verl}
    working_dir: /workspace
    ipc: host
    network_mode: host
    shm_size: "16gb"
    volumes:
      - .:/workspace
      - ${HF_CACHE:-.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      PYTHONPATH: /workspace/src:/workspace
      RAY_TMPDIR: /workspace/outputs/ray_tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
