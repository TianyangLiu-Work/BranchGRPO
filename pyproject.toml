[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-grpo"
version = "0.1.0"
description = "BranchGRPO VeRL/SGLang recipe"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  "checkpoints",
  "data",
  "outputs",
  "wandb",
]
